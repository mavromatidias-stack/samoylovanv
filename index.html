/* ============ КОНЕЦ БЛОКА С ТЕКСТАМИ ============ */

(function () {
  var D = window.KK_DATA;
  var BG = '#F4F7FA';      // фон страницы
  var HEAD = '#172B38';    // цвет шапки (тёмный блок сверху)

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }

  /* ---------- 3. Определяем, открыто ли приложение внутри Телеграма ---------- */
  function detectTelegram() {
    var h = location.hash || '';
    var s = location.search || '';
    if (h.indexOf('tgWebApp') > -1 || s.indexOf('tgWebApp') > -1) return true;
    if (window.TelegramWebviewProxy) return true;
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction) return true;
    } catch (e) {}
    return false;
  }
  var inTg = detectTelegram();
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

  /* ---------- Разметка из объекта KK_DATA ---------- */
  $('hero-eyebrow').textContent = D.hero.eyebrow;
  $('hero-title').innerHTML = D.hero.title;
  $('hero-text').textContent = D.hero.text;

  $('cta-title').innerHTML = D.cta.title;
  $('cta-text').textContent = D.cta.text;

  $('list-label').textContent = D.nav.label;
  $('list-title').innerHTML = D.nav.title;
  $('list-text').textContent = D.nav.text;

  $('footer-name').innerHTML = D.footer.name;
  $('footer-sub').textContent = D.footer.sub;

  var ARROW = '<svg class="card-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>';

  /* ---------- 6. Ссылки: настоящие <a href> с data-url ---------- */
  var target = inTg ? '_self' : '_blank';

  var btn = $('cta-btn');
  btn.textContent = D.cta.button;
  btn.setAttribute('href', D.cta.url);
  btn.setAttribute('data-url', D.cta.url);
  btn.setAttribute('target', target);
  btn.setAttribute('rel', 'noopener noreferrer');

  var chips = '';
  var html = '';
  for (var s = 0; s < D.sections.length; s++) {
    var sec = D.sections[s];
    chips += '<a class="chip" href="#sec-' + esc(sec.id) + '" data-jump="sec-' + esc(sec.id) + '">' + esc(sec.chip) + '</a>';
    html += '<section class="sec" id="sec-' + esc(sec.id) + '">' +
              '<p class="sec-label">' + esc(sec.label) + '</p>' +
              '<h3 class="sec-title">' + sec.title + '</h3>';
    if (sec.info) {
      html += '<div class="info"><p class="info-intro">' + esc(sec.info.intro) + '</p>';
      for (var p = 0; p < sec.info.points.length; p++) {
        html += '<div class="info-item"><p class="info-t">' + esc(sec.info.points[p].t) + '</p><p class="info-d">' + esc(sec.info.points[p].d) + '</p></div>';
      }
      html += '<p class="info-note">' + esc(sec.info.note) + '</p></div>';
    }
    for (var i = 0; i < sec.cards.length; i++) {
      var c = sec.cards[i];
      html += '<a class="card" href="' + esc(c.url) + '" data-url="' + esc(c.url) + '" target="' + target + '" rel="noopener noreferrer">' +
                '<span class="card-num">' + pad(i + 1) + '</span>' +
                '<span class="card-body">' +
                  '<span class="card-title" style="display:block">' + esc(c.title) + '</span>' +
                  '<span class="card-sub" style="display:block">' + esc(c.sub) + '</span>' +
                '</span>' + ARROW +
              '</a>';
    }
    html += '</section>';
  }
  $('chips').innerHTML = chips;
  $('sections').innerHTML = html;

  /* Переход по рубрикам внутри страницы (без смены location.hash, там данные Телеграма) */
  var jumps = document.querySelectorAll('a[data-jump]');
  for (var j = 0; j < jumps.length; j++) {
    jumps[j].addEventListener('click', function (e) {
      e.preventDefault();
      var el = document.getElementById(this.getAttribute('data-jump'));
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  /* ---------- 5. Отправка событий напрямую, если объекта Telegram.WebApp нет ---------- */
  function postEvent(name, data) {
    data = data || {};
    try {
      if (window.TelegramWebviewProxy && typeof window.TelegramWebviewProxy.postEvent === 'function') {
        window.TelegramWebviewProxy.postEvent(name, JSON.stringify(data));
        return;
      }
      if (window.external && typeof window.external.notify === 'function') {
        window.external.notify(JSON.stringify({ eventType: name, eventData: data }));
        return;
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ eventType: name, eventData: data }), '*');
      }
    } catch (e) {}
  }

  function isTme(url) {
    return url.indexOf('https://t.me/') === 0;
  }

  function openUrl(url) {
    if (tg) {
      if (isTme(url)) {
        // Порядок важен: сначала close, сразу после него openTelegramLink.
        // Иначе на айфоне приложение не закроется и зависнет поверх канала.
        tg.close();
        tg.openTelegramLink(url);
      } else {
        tg.openLink(url);
      }
      return;
    }
    // Объекта Telegram.WebApp нет, но мы внутри Телеграма: шлём события напрямую
    if (isTme(url)) {
      postEvent('web_app_close');
      postEvent('web_app_open_tg_link', { path_full: url.replace('https://t.me', '') });
    } else {
      postEvent('web_app_open_link', { url: url });
    }
  }

  /* Обработчик клика: внутри Телеграма перехватываем, в обычном браузере ссылка открывается сама */
  var links = document.querySelectorAll('a[data-url]');
  for (var k = 0; k < links.length; k++) {
    links[k].addEventListener('click', function (e) {
      if (!inTg) return;
      e.preventDefault();
      openUrl(this.getAttribute('data-url'));
    });
  }

  /* ---------- 4. Запуск: ready, expand, цвета шапки и фона ---------- */
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.setHeaderColor(HEAD); } catch (e) {}
    try { tg.setBackgroundColor(BG); } catch (e) {}
    try { if (tg.setBottomBarColor) tg.setBottomBarColor(HEAD); } catch (e) {}
  } else if (inTg) {
    postEvent('web_app_ready');
    postEvent('web_app_expand');
    postEvent('web_app_set_header_color', { color: HEAD });
    postEvent('web_app_set_background_color', { color: BG });
  }
})();
</script>
